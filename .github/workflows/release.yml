name: Release Apple Silicon macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: |
          cargo test --locked
          npm ci --ignore-scripts --legacy-peer-deps
          npm test
      - name: Build and smoke test
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/usage
          target/aarch64-apple-darwin/release/usage --help
      - name: Package CLI and Pi bundle
        run: |
          mkdir -p dist/usage-macos-arm64/bin dist/pi-codex-bundle-macos-arm64/bin
          cp target/aarch64-apple-darwin/release/usage dist/usage-macos-arm64/bin/
          cp target/aarch64-apple-darwin/release/usage dist/pi-codex-bundle-macos-arm64/bin/
          cp LICENSE README.md INSTALL.md dist/usage-macos-arm64/
          cp LICENSE README.md INSTALL.md package.json dist/pi-codex-bundle-macos-arm64/
          cp -R extensions dist/pi-codex-bundle-macos-arm64/
          cd dist
          tar -czf usage-macos-arm64.tar.gz usage-macos-arm64
          zip -qr pi-codex-bundle-macos-arm64.zip pi-codex-bundle-macos-arm64
          shasum -a 256 usage-macos-arm64.tar.gz pi-codex-bundle-macos-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "usage $TAG" --generate-notes
          fi
