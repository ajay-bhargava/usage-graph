[package]
name = "usage-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Static multi-account remaining-usage reports for Codex and xAI subscriptions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ajay-bhargava/usage-graph"
homepage = "https://github.com/ajay-bhargava/usage-graph"
keywords = ["codex", "openai", "cli", "usage", "quota"]
categories = ["command-line-utilities"]

[[bin]]
name = "usage"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dirs = "6.0.0"
eyre = "0.6.12"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
